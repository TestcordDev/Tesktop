name: Rolling Latest

# Builds the newest installers on every main push and (re)publishes them to
# the rolling `latest` release, so `.../releases/tag/latest` always has fresh
# binaries. Versioned releases via tags (v*) are unaffected (see release.yml).
# The `latest` release is marked as prerelease so the in-app auto-updater
# (which tracks stable releases) ignores it.

on:
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"
    workflow_dispatch:

permissions:
    contents: write
    actions: write

concurrency:
    group: rolling-latest
    cancel-in-progress: true

jobs:
    build:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2

            - name: Install system dependencies
              if: ${{ matrix.platform == 'linux' }}
              run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build

            - name: Run Electron Builder
              run: bun run electron-builder --${{ matrix.platform }} --publish never
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ matrix.platform }}
                  retention-days: 3
                  path: |
                      dist/*.AppImage
                      dist/*.tar.gz
                      dist/*.deb
                      dist/*.rpm
                      dist/*.exe
                      dist/*.zip
                      dist/*.blockmap
                      dist/latest.yml

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  pattern: installers-*
                  merge-multiple: true
                  path: release-assets

            - name: List assets
              run: ls -lh release-assets/

            - name: Publish to latest release
              run: |
                  if ! gh release view latest >/dev/null 2>&1; then
                    gh release create latest \
                      --prerelease \
                      --title "Latest rolling build (main)" \
                      --notes "Rolling build; auto-updated on every push to main. For stable versions see the v* releases."
                  fi
                  gh release edit latest --notes "Rolling build from main @ ${{ github.sha }}. Auto-updated on every push; for stable versions see the v* releases."
                  gh release upload latest release-assets/* --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
